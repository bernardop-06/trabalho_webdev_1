<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atitudes — Protótipo de Avaliação Atitudinal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#2F9E41; --verde-esc:#17502A; --verde-claro:#EAF6EC; --verde-borda:#C9DCCD;
  --branco:#FFFFFF; --tinta:#1C2B20; --suave:#55665A; --fundo:#F4FAF5;
  --ambar:#9A5B00; --ambar-bg:#FDF1DC; --neutro:#5F6B63; --neutro-bg:#EEF1EF;
  --alerta3:#B3261E; --alerta3-bg:#FBE9E7; --azul:#1D4ED8;
  --r-s:8px; --r-m:14px; --r-l:22px;
  font-family:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  color:var(--tinta);
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
a{color:var(--verde-esc)}
h1,h2,h3{margin:0;line-height:1.2}
.muted{color:var(--suave)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.btn{border:0;border-radius:999px;padding:12px 20px;background:var(--verde);color:#fff;font-weight:700}
.btn:hover{background:var(--verde-esc)}
.btn.sec{background:var(--branco);color:var(--verde-esc);box-shadow:inset 0 0 0 1.5px var(--verde)}
.btn.sec:hover{background:var(--verde-claro)}
.btn.full{width:100%}
.btn.sm{padding:7px 14px;font-size:14px}
.chip{border:1.5px solid var(--verde-borda);background:var(--branco);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--verde-esc);border-color:var(--verde-esc);color:#fff}
.card{background:var(--branco);border:1px solid var(--verde-borda);border-radius:var(--r-m);padding:16px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px}
.t-d{background:var(--verde-claro);color:var(--verde-esc)}
.t-n{background:var(--neutro-bg);color:var(--neutro)}
.t-a{background:var(--ambar-bg);color:var(--ambar)}
.t-rev{background:#E8EEFC;color:var(--azul)}
.t-ct{background:var(--ambar-bg);color:var(--ambar)}
.sym{font-size:11px}
.note{display:flex;gap:10px;background:var(--verde-claro);border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;color:var(--verde-esc)}
.note b{white-space:nowrap}
.err{color:var(--alerta3);font-size:13px;margin-top:6px}
textarea{width:100%;border:1.5px solid var(--verde-borda);border-radius:var(--r-s);padding:10px;min-height:96px;resize:vertical;background:#fff}
input[type=text],input[type=number],select{border:1.5px solid var(--verde-borda);border-radius:var(--r-s);padding:9px 10px;background:#fff;width:100%}
label.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
label.check input{width:20px;height:20px;accent-color:var(--verde);margin-top:2px}

/* ---------- Launcher ---------- */
.launch{max-width:1040px;margin:0 auto;padding:48px 24px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--verde);display:grid;grid-template-columns:repeat(2,12px);gap:4px;place-content:center}
.logo i{width:12px;height:12px;border-radius:3px;background:#fff;display:block}
.logo i:first-child{border-radius:50%;background:#fff}
.launch h1{font-size:40px;margin:28px 0 10px;max-width:16ch;color:var(--verde-esc)}
.launch .lead{font-size:18px;max-width:58ch;color:var(--suave)}
.perfis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:36px}
.perfil{text-align:left;border:1.5px solid var(--verde-borda);background:#fff;border-radius:var(--r-l);padding:22px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.perfil:hover{border-color:var(--verde);background:var(--verde-claro)}
.perfil h2{font-size:21px}
.perfil .dev{align-self:flex-start;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--verde);color:#fff}
.perfil .dev.d{background:var(--verde-esc)}
.perfil p{margin:0;color:var(--suave);font-size:14.5px}
.launch footer{margin-top:40px;font-size:13.5px;color:var(--suave)}

/* ---------- Mobile shell ---------- */
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;gap:14px}
.stage-top{width:390px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.stage-top a{font-weight:700;text-decoration:none}
.phone{width:390px;height:800px;background:var(--branco);border-radius:40px;border:10px solid var(--tinta);overflow:hidden;position:relative;display:flex;flex-direction:column}
.m-head{background:var(--verde);color:#fff;padding:22px 18px 16px}
.m-head .sub{opacity:.9;font-size:14px}
.m-head h1{font-size:22px;margin-top:2px}
.m-head .back{color:#fff;text-decoration:none;font-size:14px;font-weight:700;display:inline-block;margin-bottom:6px}
.m-body{flex:1;overflow-y:auto;padding:16px 16px 96px}
.tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--verde-borda);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px 14px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;text-decoration:none;color:var(--suave);padding:4px 0}
.tabbar a .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.tabbar a.on{color:var(--verde-esc);font-weight:700}
.tabbar a.on .ico{background:var(--verde-claro)}
.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:600px){
  .stage{padding:0}
  .stage-top{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0}
}

/* Registro rápido */
.taps{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--verde-esc)}
.taps span{width:22px;height:8px;border-radius:4px;background:var(--verde-borda)}
.taps span.on{background:var(--verde)}
.grid-alunos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.al{border:1.5px solid var(--verde-borda);background:#fff;border-radius:var(--r-m);padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;position:relative}
.al .av{width:42px;height:42px;border-radius:50%;background:var(--verde-claro);color:var(--verde-esc);display:grid;place-items:center;font-weight:700;font-size:15px}
.al.sel{border-color:var(--verde-esc);background:var(--verde-claro)}
.al.sel .av{background:var(--verde-esc);color:#fff}
.al .pend{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--ambar);box-shadow:0 0 0 2px #fff}
.sheet-bg{position:absolute;inset:0;background:rgba(23,80,42,.28);display:flex;align-items:flex-end;z-index:5}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:14px 18px 26px;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--verde-borda);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.dimbtns{display:grid;gap:8px;margin-top:12px}
.dimbtn{border:1.5px solid var(--verde-borda);background:#fff;border-radius:var(--r-m);padding:11px 14px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:1px}
.dimbtn:hover{border-color:var(--verde)}
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tipo{border:0;border-radius:var(--r-m);padding:18px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14.5px}
.tipo .s{font-size:22px;line-height:1}
.tipo.d{background:var(--verde-claro);color:var(--verde-esc)}
.tipo.n{background:var(--neutro-bg);color:var(--neutro)}
.tipo.a{background:var(--ambar-bg);color:var(--ambar)}
.toast{position:absolute;left:12px;right:12px;bottom:84px;background:var(--tinta);color:#fff;border-radius:var(--r-m);padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:6;font-size:14px}
.toast.desk{position:fixed;left:auto;right:24px;bottom:24px;max-width:420px}
.toast button{background:transparent;border:0;color:#9FE3AB;font-weight:700;padding:4px 6px}

/* Timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{border-left:2px solid var(--verde-borda);padding:0 0 16px 16px;position:relative}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--verde)}
.tl .meta{font-size:12.5px;color:var(--suave)}
.list-btn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:#fff;border-bottom:1px solid var(--verde-borda);padding:13px 2px;text-align:left}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.seg button{border:1.5px solid var(--verde-borda);background:#fff;border-radius:10px;padding:9px 2px;font-size:12.5px}
.seg button.on{background:var(--verde-esc);border-color:var(--verde-esc);color:#fff;font-weight:700}
.bar{height:10px;border-radius:5px;background:var(--verde-claro);overflow:hidden}
.bar i{display:block;height:100%;background:var(--verde)}
.msg{border-radius:var(--r-m);padding:10px 12px;font-size:14.5px;max-width:88%}
.msg.me{background:var(--verde-claro);margin-left:auto}
.msg.them{background:var(--neutro-bg)}
.msg .who{font-size:12px;font-weight:700;color:var(--suave);margin-bottom:2px}
.steps{display:flex;gap:6px;font-size:12px}
.steps span{flex:1;text-align:center;padding:6px 2px;border-radius:8px;background:var(--neutro-bg);color:var(--suave)}
.steps span.done{background:var(--verde);color:#fff;font-weight:700}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--verde-borda);font-size:14.5px}
.switch input{width:44px;height:24px;accent-color:var(--verde)}

/* ---------- Desktop shell ---------- */
.desk{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--verde-esc);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{color:#fff;margin:0 8px 22px}
.side .brand .logo{background:var(--verde)}
.side a{color:#E3F3E6;text-decoration:none;padding:10px 12px;border-radius:10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.side a:hover{background:rgba(255,255,255,.08)}
.side a.on{background:var(--branco);color:var(--verde-esc);font-weight:700}
.side .count{background:var(--alerta3);color:#fff;border-radius:999px;font-size:12px;padding:0 8px;font-weight:700}
.side .foot{margin-top:auto;font-size:13px;opacity:.85;padding:0 8px}
.side .foot a{padding:6px 0;color:#fff;font-weight:700}
.main{padding:28px 32px 48px;max-width:1280px}
.main h1{font-size:28px;color:var(--verde-esc)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 20px}
.toolbar select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border:1px solid var(--verde-borda);border-radius:var(--r-m);padding:16px 18px;text-decoration:none;color:inherit}
.kpi .v{font-size:34px;font-weight:700;color:var(--verde-esc);line-height:1.1}
.kpi.warn .v{color:var(--alerta3)}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.alertas{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.ac{background:#fff;border:1px solid var(--verde-borda);border-radius:var(--r-m);padding:16px;border-top:6px solid var(--ambar-bg)}
.ac.n2{border-top-color:#E9A23B}
.ac.n3{border-top-color:var(--alerta3)}
.nivel{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center}
.nivel.n1{background:var(--ambar-bg);color:var(--ambar)}
.nivel.n2{background:#FBE3BF;color:#7A4300}
.nivel.n3{background:var(--alerta3-bg);color:var(--alerta3)}
.inds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.ind{border-radius:10px;padding:10px;background:var(--neutro-bg);font-size:12.5px}
.ind .k{font-weight:700;color:var(--suave)}
.ind .v{font-size:20px;font-weight:700;display:flex;align-items:center;gap:4px}
.ind.bad{background:var(--ambar-bg)} .ind.bad .v{color:var(--ambar)}
.ind.ok{background:var(--verde-claro)} .ind.ok .v{color:var(--verde-esc)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{text-align:left;font-size:13px;color:var(--suave);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--verde-borda)}
table.t td{padding:10px;border-bottom:1px solid var(--verde-borda)}
.heat{display:grid;gap:4px;font-size:13px}
.heat .c{border-radius:6px;padding:10px 4px;text-align:center;font-weight:700}
.heat .h{font-weight:700;color:var(--suave);font-size:12.5px;padding:4px;display:flex;align-items:flex-end}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col{background:var(--verde-claro);border-radius:var(--r-m);padding:12px}
.col h3{font-size:15px;margin:2px 4px 10px;color:var(--verde-esc)}
.kc{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid var(--verde-borda);font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(23,80,42,.35);display:grid;place-items:center;z-index:20;padding:20px}
.modal{background:#fff;border-radius:var(--r-l);padding:24px;width:520px;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--suave)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stackbar{display:flex;height:22px;border-radius:6px;overflow:hidden}
.stackbar i{display:block}
@media (max-width:960px){
  .desk{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}
  .side .brand,.side .foot{display:none}
  .side a{white-space:nowrap}
  .kpis,.g2,.g3,.kanban{grid-template-columns:1fr 1fr}
  .main{padding:20px 16px}
}
@media (max-width:600px){.kpis,.g2,.g3,.kanban{grid-template-columns:1fr}}
</style>
</head>

function radar(series,size=280,legend=true){
  const W=size+110,H=size,cx=W/2,cy=H/2,r=size/2-26,n=5,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*r*v,cy+Math.sin(a)*r*v]};
  let g='';
  [.25,.5,.75,1].forEach(k=>{g+=`<polygon points="${[...Array(n)].map((_,i)=>pt(i,k).join(',')).join(' ')}" fill="none" stroke="#C9DCCD"/>`});
  for(let i=0;i<n;i++){const[x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#C9DCCD"/>`;
    const a=-Math.PI/2+i*2*Math.PI/n,lx=cx+Math.cos(a)*(r+10),ly=cy+Math.sin(a)*(r+10);
    const anc=Math.abs(Math.cos(a))<.2?'middle':Math.cos(a)>0?'start':'end';const dy=i===0?-4:Math.sin(a)>.5?14:5;
    g+=`<text x="${lx}" y="${ly+dy}" font-size="12.5" text-anchor="${anc}" fill="#55665A" font-weight="700">${DIMS[i].c}</text>`}
  series.forEach(s=>{g+=`<polygon points="${s.v.map((v,i)=>pt(i,v).join(',')).join(' ')}" fill="${s.fill||'none'}" stroke="${s.cor}" stroke-width="2.5" ${s.dash?'stroke-dasharray="6 5"':''}/>`;
    s.v.forEach((v,i)=>{const[x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${s.cor}"/>`})});
  const lg=legend?`<div class="legend" style="justify-content:center">${series.map(s=>`<span><i style="background:${s.cor}"></i>${s.nome}${s.dash?' (tracejado)':''}</span>`).join('')}</div>`:'';
  return `<div><svg viewBox="0 -12 ${W} ${H+24}" width="100%" style="max-width:${W}px;display:block;margin:0 auto" role="img" aria-label="Gráfico de radar por dimensão">${g}</svg>${lg}</div>`;
}
function spark(arr,w=130,h=34,cor='#9A5B00'){
  const p=arr.map((v,i)=>`${(i/(arr.length-1))*(w-6)+3},${h-3-v*(h-6)}`).join(' ');
  const last=p.split(' ').pop().split(',');
  return `<svg width="${w}" height="${h}" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${cor}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${cor}"/></svg>`;
}
let toastTimer;
function toast(msg,acts=[],desk=false){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const host=desk?document.body:($('.phone')||document.body);
  const t=document.createElement('div');t.className='toast'+(desk?' desk':'');t.setAttribute('role','status');
  t.innerHTML=`<div style="flex:1">${msg}</div>`+acts.map((a,i)=>`<button data-i="${i}">${a[0]}</button>`).join('');
  t.querySelectorAll('button').forEach(b=>b.onclick=()=>{t.remove();acts[b.dataset.i][1]()});
  host.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),6000);
}

function tapAluno(id){const R=S.reg;
  if(R.multi){R.sel=R.sel.includes(id)?R.sel.filter(x=>x!==id):[...R.sel,id];R.taps=R.sel.length?1:0;render();return}

function tapDim(d){S.reg.dim=d;S.reg.taps=2;render()}
function tapTipo(t){const R=S.reg;R.taps=3;
  const novos=R.sel.map(id=>({id:Date.now()+Math.random(),al:id,dim:R.dim,t,dt:'27/10',prof:'Prof.ª Marta (Matemática)',txt:'',st:'revisao'}));
  S.registros.unshift(...novos);
  const nomes=R.sel.map(id=>al(id).curto).join(', '),dn=dim(R.dim).n;
  R.last=R.multi?R.sel.length+2:3;R.open=false;R.dim=null;const sel=[...R.sel];R.taps=0;R.sel=[];render();
  toast(`<b>Salvo</b> · ${esc(nomes)} · ${dn} · ${TIPOS[t].n}`,[
    ['Desfazer',()=>{S.registros=S.registros.filter(r=>!novos.includes(r));toast('Registro desfeito')}],
    ['Comentar',()=>{S.reg.sel=sel;S.reg.open=true;S.reg.comment=true;S.reg.novos=novos;render()}]]);
}

function rng(seed){return()=>{seed=(seed*9301+49297)%233280;return seed/233280}}
const POOL=['Alice','Arthur','Beatriz','Benício','Cecília','Cauã','Clara','Daniel','Eduarda','Enzo','Fernanda','Gabriel','Helena','Igor','Júlia','Lucas','Manuela','Matheus','Nicolas','Olívia','Pedro','Rafaela','Samuel','Sofia','Theo','Valentina','Vitor','Yasmin'];
const SOBR=['Alves','Barbosa','Campos','Duarte','Esteves','Fonseca','Guedes','Lopes','Moura','Pinto','Queiroz','Sales','Teixeira','Vieira'];
const BIM={'1':'1º bimestre','2':'2º bimestre'};
function heatBim(ti,bim){return HEAT[ti].map((v,j)=>bim==='2'?v:Math.max(4,v-7+((ti*3+j)%6)))}
function dadosTurma(turma,bim){
  const ti=TURMAS.indexOf(turma),r=rng(ti*31+(+bim)*7+3),a=heatBim(ti,bim);
  const dist=a.map(x=>{const d=Math.round(30+r()*25);return[d,100-d-x,x]});
  let alunos;
  if(turma==='7º B')alunos=ALUNOS.map(x=>({nome:x.nome,id:x.id}));
  else{const used=new Set();alunos=[];const n=12+Math.floor(r()*6);
    while(alunos.length<n){const nm=POOL[Math.floor(r()*POOL.length)]+' '+SOBR[Math.floor(r()*SOBR.length)];if(!used.has(nm)){used.add(nm);alunos.push({nome:nm})}}
    alunos.sort((x,y)=>x.nome.localeCompare(y.nome,'pt'))}
  alunos.forEach(al=>{al.sim=a.map((x,j)=>{if(al.id===HEITOR&&j===2&&bim==='2')return'a';const v=r()*100;return v<x?'a':v<x+dist[j][0]?'d':'n'})});
  return{dist,alunos,profs:5+Math.floor(r()*3),regs:Math.round(alunos.length*(bim==='2'?8.5:7)*(0.9+r()*0.3))};
}

   <h2 style="font-size:17px;margin:18px 0 10px">Regra do alerta precoce</h2><div class="row wrap"><div style="flex:1;min-width:140px"><label class="small"><b>Registros “A desenvolver”</b></label><input type="number" value="3" min="2"></div><div style="flex:1;min-width:140px"><label class="small"><b>Janela (dias)</b></label><input type="number" value="15"></div><div style="flex:1;min-width:140px"><label class="small"><b>Frequência abaixo de</b></label><input type="number" value="80"></div></div>
   <button class="btn sm" style="margin-top:12px" onclick="toast('Regra salva · alteração registrada na auditoria',[],true)">Salvar regra</button></section>
   <section class="card"><h2 style="font-size:17px;margin-bottom:10px">Log de auditoria</h2><table class="t"><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Alvo</th></tr>${log.map(l=>`<tr>${l.map(c=>`<td class="small">${c}</td>`).join('')}</tr>`).join('')}</table>
   <div class="note" style="margin-top:14px"><b>LGPD:</b> registros guardados até o fim do ano letivo seguinte; acesso por perfil; toda leitura de ficha individual é registrada.</div></section></div>`;
  return dshell('Configurações e auditoria',body);
}

/* ================= Estudante ================= */
const ETABS=[['Evolução','#/aluno','chart'],['Autoavaliar','#/aluno/autoavaliacao','check'],['Devolutivas','#/aluno/devolutivas','book'],['Registros','#/aluno/registros','list']];
function alunoHome(){
  const frases=[['Colaboração','cresceu desde o 1º bimestre','d'],['Respeito e convivência','é um ponto forte seu','d'],['Autonomia','é o que vamos desenvolver juntos','a']];
  const body=`${radar([{nome:'Agora',v:RAD.atual,cor:'#2F9E41',fill:'rgba(47,158,65,.15)'},{nome:'1º bimestre',v:RAD.antes,cor:'#55665A',dash:1}],280)}
   <div class="note" style="margin:14px 0"><b>Só você:</b> este gráfico compara você com você mesmo. Ninguém da turma vê seus dados.</div>
   <div class="stack">${frases.map(f=>`<div class="card row" style="padding:12px 14px">${tag(f[2])}<div><b>${f[0]}</b> <span class="muted">${f[1]}</span></div></div>`).join('')}</div>
   <div class="card" style="margin-top:12px;background:var(--verde-claro);border-color:var(--verde)"><b>Sua autoavaliação está aberta</b><p class="small muted" style="margin:4px 0 10px">Leva uns 3 minutos. Fecha na sexta, 30/10.</p><button class="btn full" onclick="go('#/aluno/autoavaliacao')">Responder agora</button></div>`;
  return mshell({perfil:'Estudante',head:mhead('7º ano B','Oi, Heitor'),body,tabs:ETABS,cur:'Evolução'});
}
function alunoAuto(){
  const ops=['Ainda não','Às vezes','Quase sempre','Sempre'];
  const perg={resp:'Entrego as atividades no prazo e cuido do meu material.',colab:'Ajudo e escuto os colegas nos trabalhos em grupo.',auto:'Quando travo numa atividade, tento de outro jeito ou peço ajuda.',part:'Participo das discussões e mostro interesse nas aulas.',conv:'Trato todo mundo com respeito, mesmo quem pensa diferente.'};
  const body=S.aaDone?`<div class="card stack" style="text-align:center"><div style="font-size:40px;color:var(--verde)">✓</div><h2 style="font-size:20px">Obrigado, Heitor!</h2><p class="small muted">Sua professora vai usar suas respostas na próxima devolutiva. Não existe resposta certa ou errada.</p><button class="btn sec full" onclick="go('#/aluno')">Ver minha evolução</button></div>`:
  `<p class="small muted" style="margin-top:0">Pense no último mês. Não existe resposta certa ou errada, e isso não vale nota.</p>
   <div class="stack">${DIMS.map(d=>`<div class="card"><div class="small muted"><b>${d.n}</b></div><div style="font-size:15px;margin-top:2px">${perg[d.id]}</div>
    <div class="seg" role="radiogroup" aria-label="${d.n}">${ops.map((o,i)=>`<button role="radio" aria-checked="${S.aaResp[d.id]===i}" class="${S.aaResp[d.id]===i?'on':''}" onclick="S.aaResp['${d.id}']=${i};render(true)">${o}</button>`).join('')}</div></div>`).join('')}</div>
   <label class="small" style="display:block;margin-top:14px"><b>Quer contar algo mais? (opcional)</b></label><textarea placeholder="Ex.: Em Matemática fico com vergonha de perguntar."></textarea>
   <div id="aa-er" class="err" ${S.aaErr?'':'hidden'}>Responda as ${DIMS.length} perguntas para enviar (faltam ${DIMS.length-Object.keys(S.aaResp).length}).</div>
   <button class="btn full" style="margin-top:12px" onclick="enviarAuto()">Enviar autoavaliação</button>`;
  return mshell({perfil:'Estudante',head:mhead('2º bimestre · fecha 30/10','Autoavaliação'),body,tabs:ETABS,cur:'Autoavaliar'});
}
function enviarAuto(){if(Object.keys(S.aaResp).length<DIMS.length){S.aaErr=true;render(true);return}S.aaErr=false;S.aaDone=true;render()}
function devolutivaCard(resp){
  return `<div class="card stack"><div class="row between"><b>Prof.ª Marta · Matemática</b><span class="small muted">26/10</span></div>
   <div><div class="small muted"><b>Pontos fortes</b></div>Você tem ajudado os colegas com paciência e defende quem está sendo desrespeitado.</div>
   <div><div class="small muted"><b>O que vamos desenvolver</b></div>Pedir ajuda quando trava numa atividade, em vez de parar.</div>
   <div class="note"><b>Meta combinada:</b> levantar a mão ao menos uma vez por aula quando tiver dúvida.</div>
   ${resp?(S.respRead?'<span class="tag t-d">✓ Leitura confirmada em 27/10</span>':'<button class="btn sec full sm" onclick="S.respRead=true;render();toast(\'Leitura confirmada · a professora foi avisada\')">Confirmar leitura</button>'):''}</div>`;
}
function alunoDev(){
  const body=`${devolutivaCard(false)}<div class="card" style="margin-top:12px"><div class="row between"><b>Prof. Rafael · Ciências</b><span class="small muted">02/09</span></div><p style="margin:6px 0 0">Sua explicação do experimento ajudou o grupo inteiro. Continue compartilhando o que descobre.</p></div>`;
  return mshell({perfil:'Estudante',head:mhead('Conversas com seus professores','Devolutivas'),body,tabs:ETABS,cur:'Devolutivas'});
}
function registrosLista(base){
  const regs=S.registros.filter(r=>r.al===HEITOR&&r.st!=='revisao');
  return `<p class="small muted" style="margin-top:0">Registros aparecem aqui depois que o professor revisa (até 48 h). Se algo não parece certo, você pode pedir uma conversa.</p>
   <ul class="tl">${regs.map(r=>`<li><div class="row wrap" style="gap:6px">${tag(r.t)}<b style="font-size:14.5px">${dim(r.dim).n}</b>${stTag(r.st)}</div>${r.txt?`<div style="font-size:14.5px;margin-top:4px">${esc(r.txt)}</div>`:''}<div class="meta">${r.dt} · ${r.prof}</div>
   ${r.st==='contestado'?`<a class="small" href="${base}/conversa"><b>Ver conversa</b></a>`:r.t==='a'?`<button class="btn sec sm" style="margin-top:6px" onclick="go('${base}/conversa')">Quero conversar sobre isso</button>`:''}</li>`).join('')}</ul>`;
}
function alunoReg(){return mshell({perfil:'Estudante',head:mhead('Só você e sua família veem','Meus registros'),body:registrosLista('#/aluno'),tabs:ETABS,cur:'Registros'})}
function conversa(base,perfil,tabs,cur,eu){
  const C=S.contest;const st=C.aberta?1:2;
  const body=`<div class="steps" aria-label="Situação da conversa"><span class="done">Aberta</span><span class="${st>=2?'done':''}">Professor respondeu</span><span>Resolvida</span></div>
   <div class="card" style="margin-top:12px"><div class="row wrap" style="gap:6px">${tag('a')}<b>Autonomia</b><span class="small muted">21/10 · Prof.ª Marta</span></div></div>
   <div class="stack" style="margin-top:14px">${C.msgs.map(m=>`<div class="msg ${m.me?'them':'me'}"><div class="who">${m.who}</div>${esc(m.txt)}</div>`).join('')}</div>
   ${C.aberta?`<div class="card" style="margin-top:12px"><p class="small muted" style="margin:0">A professora tem até 31/10 para responder. Se não responder, a coordenação acompanha a conversa.</p></div>`:
   `<textarea id="resp" style="margin-top:14px" placeholder="Responder"></textarea><div id="er" class="err" hidden>Escreva uma mensagem antes de enviar.</div><div class="row" style="margin-top:10px"><button class="btn sec" style="flex:1" onclick="toast('Conversa marcada como resolvida')">Está resolvido</button><button class="btn" style="flex:1" onclick="responderFam('${eu}')">Enviar</button></div>`}`;
  return mshell({perfil,head:mhead('Conversa sobre um registro','Diálogo',base+'/registros'),body,tabs,cur});
}
function responderFam(who){const t=$('#resp'),v=t.value.trim();if(!v){$('#er').hidden=false;t.oninput=()=>$('#er').hidden=true;return}S.contest.msgs.push({who,me:false,txt:v});render();toast('Mensagem enviada')}

/* ================= Responsável ================= */
const RTABS=[['Início','#/resp','home'],['Devolutivas','#/resp/devolutivas','book'],['Registros','#/resp/registros','list'],['Privacidade','#/resp/privacidade','lock']];
function respHome(){
  const body=`<div class="row" role="tablist">${['Heitor','Lívia'].map(c=>`<button class="chip ${S.child===c?'on':''}" role="tab" aria-selected="${S.child===c}" onclick="S.child='${c}';render()">${c} · ${c==='Heitor'?'7º B':'4º A'}</button>`).join('')}</div>
   ${S.child==='Heitor'?`<div class="card" style="margin-top:14px;border-color:var(--verde)"><b>A escola marcou uma conversa de acompanhamento</b><p class="small muted" style="margin:4px 0 10px">Com a coordenação e a orientadora, até 31/10. O objetivo é apoiar a rotina de estudos do Heitor.</p><button class="btn sec sm" onclick="toast('Horário confirmado: 30/10, 17h')">Confirmar horário · 30/10, 17h</button></div>
   <div style="margin-top:12px">${radar([{nome:'Agora',v:RAD.atual,cor:'#2F9E41',fill:'rgba(47,158,65,.15)'},{nome:'1º bimestre',v:RAD.antes,cor:'#55665A',dash:1}],260)}</div>
   <a class="card row between" href="#/resp/devolutivas" style="text-decoration:none;color:inherit;margin-top:12px"><div><b>Nova devolutiva</b><div class="small muted">Prof.ª Marta · 26/10</div></div>${S.respRead?'<span class="tag t-d">Lida</span>':'<span class="tag t-rev">Não lida</span>'}</a>
   <a class="card row between" href="#/resp/conversa" style="text-decoration:none;color:inherit;margin-top:12px"><div><b>Sua conversa sobre o registro de 21/10</b><div class="small muted">${S.contest.aberta?'Aguardando a professora':'A professora respondeu'}</div></div><span class="tag t-ct">Abrir</span></a>`
   :`<div class="card" style="margin-top:14px"><b>Lívia · 4º ano A</b><p class="small muted">Nenhuma novidade esta semana. A próxima devolutiva está prevista para o fim do bimestre.</p></div>`}`;
  return mshell({perfil:'Responsável',head:mhead('Olá, Cláudia','Acompanhamento'),body,tabs:RTABS,cur:'Início'});
}
function respDev(){return mshell({perfil:'Responsável',head:mhead('Heitor · 7º ano B','Devolutivas'),body:devolutivaCard(true),tabs:RTABS,cur:'Devolutivas'})}
function respReg(){return mshell({perfil:'Responsável',head:mhead('Heitor · 7º ano B','Registros'),body:registrosLista('#/resp'),tabs:RTABS,cur:'Registros'})}
function respPriv(){
  const body=`<div class="switch"><div><b>Tratamento dos dados de Heitor</b><div class="small muted">Consentimento dado em 03/02/2026 (LGPD, art. 14)</div></div><input type="checkbox" checked aria-label="Consentimento"></div>
   <div class="switch"><div><b>Avisos por e-mail</b><div class="small muted">Devolutivas e conversas</div></div><input type="checkbox" checked aria-label="Avisos por e-mail"></div>
   <div class="switch"><div><b>Avisos no celular</b><div class="small muted">Somente intervenções</div></div><input type="checkbox" aria-label="Avisos no celular"></div>
   <button class="btn sec full" style="margin-top:16px" onclick="toast('Arquivo com os dados do Heitor enviado ao seu e-mail')">Baixar todos os dados do Heitor</button>
   <h2 style="font-size:17px;margin:20px 0 6px">Quem acessou a ficha do Heitor</h2>
   <table class="t"><tr><th>Quando</th><th>Quem</th></tr><tr><td class="small">27/10 08:10</td><td class="small">Coord. Paula Santos</td></tr><tr><td class="small">24/10 10:02</td><td class="small">Prof.ª Marta (Matemática)</td></tr><tr><td class="small">23/10 15:40</td><td class="small">Prof. Rafael (Ciências)</td></tr></table>
   <p class="small muted">Dúvidas sobre privacidade: encarregado de dados da escola, dpo@escola.edu.br.</p>`;
  return mshell({perfil:'Responsável',head:mhead('Seus dados e os do Heitor','Privacidade'),body,tabs:RTABS,cur:'Privacidade'});
}

/* ================= Roteador ================= */
function go(h){location.hash=h}
function route(){
  const h=location.hash.replace(/^#/,'')||'/';const p=h.split('/').filter(Boolean);
  const M={'':launcher,'prof':profHome,'prof/registro':profRegistro,'prof/alunos':profAlunos,'prof/autoavaliacao':profAutoaval,'prof/dialogos':profDialogos,
   'coord':coordHome,'coord/alertas':coordAlertas,'coord/aluno':coordAluno,'coord/turma':coordTurma,'coord/clima':coordClima,'coord/intervencoes':coordInterv,'coord/config':coordConfig,
   'aluno':alunoHome,'aluno/autoavaliacao':alunoAuto,'aluno/devolutivas':alunoDev,'aluno/registros':alunoReg,'aluno/conversa':()=>conversa('#/aluno','Estudante',ETABS,'Registros','Heitor'),
   'resp':respHome,'resp/devolutivas':respDev,'resp/registros':respReg,'resp/privacidade':respPriv,'resp/conversa':()=>conversa('#/resp','Responsável',RTABS,'Registros','Cláudia Almeida (responsável)')};
  if(p[0]==='prof'&&p[1]==='aluno')return profAluno(p[2]);
  if(p[0]==='prof'&&p[1]==='devolutiva')return profDevolutiva(p[2]);
  return (M[p.join('/')]||launcher)();
}
function render(keepScroll){const mb=$('#mb'),y=keepScroll&&mb?mb.scrollTop:0,wy=window.scrollY;$('#app').innerHTML=route();const nb=$('#mb');if(nb&&keepScroll)nb.scrollTop=y;if(keepScroll)window.scrollTo(0,wy)}
window.addEventListener('hashchange',()=>{S.filtroDim=null;Object.assign(S.reg,{open:false,dim:null,sel:[],taps:0,comment:false});render();window.scrollTo(0,0)});
render();
</script>
</body>
